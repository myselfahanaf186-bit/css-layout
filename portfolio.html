<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .card {
            width: 300px;
            padding: 30px;
            text-align: center;

            background-color: white;
            border: 2px solid black;
            border-radius: 15px;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .card a {
            display: inline-block;
            padding: 10px 25px;

            background-color: black;
            color: white;

            text-decoration: none;
            border-radius: 5px;
        }

        .card a:hover {
            background-color: gray;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>My Profile</h1>

        <h2>Ariyan</h2>

        <p>Web Developer</p>

        <a href="#">Contact</a>

    </div>

</body>
</html>
